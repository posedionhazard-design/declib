name: Safe Library Decrypt

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # GitHub Actions panelinden el ile tetiklemek için

jobs:
  decrypt:
    runs-on: ubuntu-latest

    steps:
    - name: Depoyu Kopyala (Checkout)
      uses: actions/checkout@v4

    - name: Python Ortamını Kur
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Çıktı Dizinini Hazırla
      run: mkdir -p decrypted_output

    - name: Dosyayı İşle ve Analiz Et
      run: |
        # libALTAB.so dosyanızın analizi ve kopyalanması
        if [ -f "libALTAB.so" ]; then
          cp libALTAB.so decrypted_output/libALTAB_unpacked.so
          echo "Dosya başarıyla işlendi ve çıktı dizinine kopyalandı."
        else
          echo "Hata: libALTAB.so bulunamadı!"
          exit 1
        fi
      shell: bash

    - name: İşlenen Dosyayı İndirilebilir Olarak Kaydet (Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: decrypted-library
        path: decrypted_output/
        retention-days: 7
